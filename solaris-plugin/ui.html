<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    textarea { width: 100%; height: 260px; padding: 12px; border: 1px solid #e5e5e5; border-radius: 6px; resize: none; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #e5e5e5; border-radius: 6px; box-sizing: border-box; }
    button { background: #18A0FB; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:active { background: #0D8DE3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .hint { font-size: 11px; color: #999; }
    #status { font-size: 12px; color: #666; min-height: 18px; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
  </style>
</head>
<body>
  <h2>Solaris 自动排版</h2>
  <label style="font-size:13px;font-weight:600;">Gemini API Key（翻译用，可选）</label>
  <input id="apikey" type="password" placeholder="AIza..." />
  <textarea id="input" placeholder="贴入数据..."></textarea>
  <div class="row">
    <button id="go">直接生成</button>
    <button id="goTranslate">翻译后生成</button>
  </div>
  <p id="status"></p>
  <p class="hint">请确保已选中一个组件实例作为模板。</p>

  <script>
    const GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';

    async function callGemini(apiKey, prompt) {
      const maxRetries = 3;
      for (let attempt = 0; attempt < maxRetries; attempt++) {
        const res = await fetch(`${GEMINI_URL}?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        if (res.ok) {
          const json = await res.json();
          return json.candidates[0].content.parts[0].text;
        }
        if (res.status === 429 && attempt < maxRetries - 1) {
          document.getElementById('status').textContent = `⏳ 额度限制，45秒后重试 (${attempt + 1}/${maxRetries})...`;
          await new Promise(r => setTimeout(r, 45000));
          continue;
        }
        const err = await res.text();
        throw new Error('Gemini API error: ' + err);
      }
    }

    function extractReviewContents(text) {
      const lines = text.split('\n');
      const reviews = [];
      let buffer = [];
      let collecting = false;
      for (const line of lines) {
        const trimmed = line.trim();
        const isTitle = /短评/.test(trimmed) && !/★/.test(trimmed) && !/看过/.test(trimmed);
        const isFilmDir = /^(film|director)\s*[：:]/i.test(trimmed);
        const isUserA = /^.+?\s+[★☆]+\s*(?:看过|Watched)/.test(trimmed);
        const isUserB = /^.+?\s+(?:看过|Watched)\s+[★☆]+/.test(trimmed);
        const isUser = isUserA || isUserB;
        if (isTitle || isUser || isFilmDir) {
          if (buffer.length > 0) { reviews.push(buffer.join('\n')); buffer = []; }
          collecting = isUser;
          continue;
        }
        if (collecting && trimmed) buffer.push(trimmed);
      }
      if (buffer.length > 0) reviews.push(buffer.join('\n'));
      return reviews;
    }

    function replaceReviewContents(text, translations) {
      const lines = text.split('\n');
      const result = [];
      let reviewIdx = -1;
      let skipping = false;
      for (let i = 0; i < lines.length; i++) {
        const trimmed = lines[i].trim();
        const isTitle = /短评/.test(trimmed) && !/★/.test(trimmed) && !/看过/.test(trimmed);
        const isFilmDir = /^(film|director)\s*[：:]/i.test(trimmed);
        const isUserA = /^.+?\s+[★☆]+\s*(?:看过|Watched)/.test(trimmed);
        const isUserB = /^.+?\s+(?:看过|Watched)\s+[★☆]+/.test(trimmed);
        const isUser = isUserA || isUserB;
        if (isTitle || isFilmDir) { skipping = false; result.push(lines[i]); continue; }
        if (isUser) {
          reviewIdx++;
          skipping = true;
          result.push(lines[i]);
          if (reviewIdx < translations.length) { result.push(''); result.push(translations[reviewIdx]); }
          continue;
        }
        if (skipping) continue;
        result.push(lines[i]);
      }
      return result.join('\n');
    }

    document.getElementById('go').onclick = () => {
      const data = document.getElementById('input').value;
      if (!data.trim()) { document.getElementById('status').textContent = '❌ 请输入数据'; return; }
      parent.postMessage({ pluginMessage: { type: 'generate', data } }, '*');
    };

    document.getElementById('goTranslate').onclick = async () => {
      const btn = document.getElementById('goTranslate');
      const status = document.getElementById('status');
      const apiKey = document.getElementById('apikey').value.trim();
      const data = document.getElementById('input').value;

      if (!apiKey) { status.textContent = '❌ 请输入 Gemini API Key'; return; }
      if (!data.trim()) { status.textContent = '❌ 请输入数据'; return; }

      btn.disabled = true;

      try {
        const reviews = extractReviewContents(data);
        if (reviews.length === 0) { status.textContent = '❌ 未找到短评内容'; btn.disabled = false; return; }

        status.textContent = `⏳ 正在翻译 ${reviews.length} 条短评...`;

        const numbered = reviews.map((r, i) => `[${i}]\n${r}`).join('\n\n');
        const prompt = `Translate the following Chinese film reviews into English. Rules:
1. Preserve the critic's tone and style.
2. IMPORTANT: Each individual review MUST be under 550 characters. If a translation would exceed 550 characters, condense it while keeping the key insights.
3. Keep the [number] markers exactly as-is.
4. Clean up each review before translating: remove any tags (like #hashtags#), numerical scores (like 8.5, 7.6, 【C+】, 4.5), rating prefixes (like +, ++, +++, +.), and any filler text, shorthand (like w/, Nooo), or stray symbols that are not part of the actual critical content. Start the translation from the first meaningful sentence of the review.
5. Only output the translated text with the [number] markers, nothing else.

${numbered}`;

        const result = await callGemini(apiKey, prompt);

        const translations = [];
        const parts = result.split(/\[(\d+)\]\s*/);
        for (let i = 1; i < parts.length; i += 2) {
          translations[parseInt(parts[i])] = parts[i + 1].trim();
        }

        const translated = replaceReviewContents(data, translations);
        status.textContent = '✅ 翻译完成，正在生成卡片...';
        parent.postMessage({ pluginMessage: { type: 'generate', data: translated } }, '*');
      } catch (e) {
        status.textContent = '❌ ' + e.message;
        btn.disabled = false;
      }
    };

    window.onmessage = (e) => {
      const msg = e.data.pluginMessage;
      if (msg && msg.type === 'done') {
        document.getElementById('go').disabled = false;
        document.getElementById('goTranslate').disabled = false;
        document.getElementById('status').textContent = '✅ ' + msg.text;
      }
    };
  </script>
</body>
</html>
